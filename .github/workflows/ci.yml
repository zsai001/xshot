name: XShot macOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test XShot (macOS 15)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Swift test suite
        run: swift test

      - name: Build release binary
        run: swift build -c release
